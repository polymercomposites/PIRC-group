name: Optimize V2 assets

on:
  push:
    branches:
      - upgrade/pirc-website-v2

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: upgrade/pirc-website-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Optimize research images and remove unused hero source
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              Path('assets/research/polymer-composites.png'),
              Path('assets/research/sustainable-materials.png'),
              Path('assets/research/ai-computational-materials.png'),
              Path('assets/research/advanced-manufacturing.png'),
          ]

          for path in files:
              image = Image.open(path).convert('RGB')
              image.thumbnail((960, 640), Image.Resampling.LANCZOS)
              image = image.quantize(
                  colors=256,
                  method=Image.Quantize.FASTOCTREE,
                  dither=Image.Dither.FLOYDSTEINBERG,
              )
              image.save(path, optimize=True, compress_level=9)
              print(f'{path}: {path.stat().st_size / 1024:.1f} KB')

          unused_hero_source = Path('assets/hero/image.png')
          if unused_hero_source.exists():
              unused_hero_source.unlink()
              print(f'Removed {unused_hero_source}')
          PY

      - name: Commit optimized assets
        run: |
          if git diff --quiet; then
            echo "No asset changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research assets/hero
          git commit -m "Optimize V2 research images"
          git push origin HEAD:upgrade/pirc-website-v2
