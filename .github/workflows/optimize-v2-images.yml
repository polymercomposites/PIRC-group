name: Optimize V2 member images

on:
  push:
    branches:
      - upgrade/pirc-website-v2
    paths:
      - .github/workflows/optimize-v2-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/pirc-website-v2

      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow

      - name: Create optimized WebP portraits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json

          output_dir = Path('assets/people')
          output_dir.mkdir(parents=True, exist_ok=True)

          conversions = {
              'obed.png': output_dir / 'obed.webp',
              'Manan.jpg': output_dir / 'manan.webp',
          }

          for source_name, destination in conversions.items():
              source = Path(source_name)
              if not source.exists():
                  raise FileNotFoundError(source)

              with Image.open(source) as image:
                  image = ImageOps.exif_transpose(image)
                  if image.mode not in ('RGB', 'RGBA'):
                      image = image.convert('RGB')
                  if image.mode == 'RGBA':
                      background = Image.new('RGB', image.size, 'white')
                      background.paste(image, mask=image.getchannel('A'))
                      image = background
                  image.thumbnail((900, 900), Image.Resampling.LANCZOS)
                  image.save(destination, 'WEBP', quality=82, method=6)

          members_path = Path('data/members.json')
          members = json.loads(members_path.read_text(encoding='utf-8'))
          for member in members:
              if member.get('image') == 'obed.png':
                  member['image'] = 'assets/people/obed.webp'
              elif member.get('image') == 'Manan.jpg':
                  member['image'] = 'assets/people/manan.webp'
          members_path.write_text(json.dumps(members, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Show optimized sizes
        run: ls -lh obed.png Manan.jpg assets/people/obed.webp assets/people/manan.webp

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/people/obed.webp assets/people/manan.webp data/members.json
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimize member portraits for web"
            git push origin HEAD:upgrade/pirc-website-v2
          fi
