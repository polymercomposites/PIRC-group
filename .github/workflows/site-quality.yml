name: Site quality

on:
  push:
    branches:
      - main
      - upgrade/pirc-website-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run site integrity checks
        run: node scripts/check-site.mjs
